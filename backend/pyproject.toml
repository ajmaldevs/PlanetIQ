[project]
name = "planetiq-backend"
version = "0.1.0"
description = "PlanetIQ - Earth Observation and Environmental Analysis Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "greenlet>=3.0.0",
    "google-genai>=1.0.0",
    "numpy>=1.26.0",
    "rasterio>=1.3.10",
    "netCDF4>=1.6.0",
    "h5py>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
