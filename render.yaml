services:
  # PlanetIQ FastAPI Backend API
  - type: web
    name: planetiq
    runtime: python
    region: oregon
    plan: standard
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1
      - key: CORS_ORIGINS
        value: '["https://planetiq-1.onrender.com"]'
      - key: DATABASE_URL
        fromDatabase:
          name: planetiq-database
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: "10"
      - key: DATABASE_MAX_OVERFLOW
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NASA_EARTHDATA_BEARER_TOKEN
        sync: false
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false

  # PlanetIQ React Frontend (Static Site)
  - type: web
    runtime: static
    name: planetiq-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: VITE_API_BASE_URL
        value: https://planetiq.onrender.com/api/v1
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: planetiq-database
    plan: standard
    region: oregon
    databaseName: planetiq_database
    user: planetiq_database_user
    postgresMajorVersion: 16
