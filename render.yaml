
services:
  # PlanetIQ FastAPI Backend API
  - type: web
    name: terralens-backend
    runtime: python
    region: oregon
    plan: standard
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1
      - key: CORS_ORIGINS
        fromService:
          name: terralens-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: POSTGRES_SERVER
        fromDatabase:
          name: terralens-postgis
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: terralens-postgis
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: terralens-postgis
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: terralens-postgis
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: terralens-postgis
          property: database
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: NASA_EARTHDATA_BEARER_TOKEN
        sync: false

  # PlanetIQ React Frontend (Static Site)
  - type: web
    runtime: static
    name: terralens-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: VITE_API_BASE_URL
        value: https://planetiq-1.onrender.com/api/v1
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: terralens-postgis
    plan: standard
    region: oregon
    databaseName: terralens_db
    user: terralens_user
    postgresMajorVersion: 16
